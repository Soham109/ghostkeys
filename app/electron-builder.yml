appId: com.ghostkeys.app
productName: Ghostkeys
directories:
  buildResources: resources
  output: release
files:
  - out/**
  - package.json
  - "!**/*.map"
asarUnpack:
  - resources/**
extraResources:
  - from: resources
    to: .
    filter:
      - 'tray*.png'
  - from: ../presets
    to: presets
    filter:
      - library.json
      - layouts/*.json
mac:
  category: public.app-category.utilities
  icon: resources/icon.icns
  target:
    - target: dir
      arch: [arm64]
  identity: null
  hardenedRuntime: false
  extendInfo:
    LSUIElement: false
    NSHumanReadableCopyright: Ghostkeys
npmRebuild: false
